<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Control - Ferretería Los Maestros</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css?v=3">
</head>
<body class="bg-dark bg-opacity-25 py-4">

  <div class="container p-3 p-md-4 contenedor-maqueta">

    <!-- HEADER ADMIN -->
    <header class="border-bottom border-3 border-dark pb-3 mb-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="badge bg-danger text-white font-monospace">
          SISTEMA INTERNO: GESTIÓN DE ACTIVOS Y PRODUCTOS (CRUD PA LOS LOLOS)
        </span>
        <div class="d-flex gap-2">
          <a href="index.html" class="btn btn-sm btn-outline-dark fw-semibold text-uppercase">Ver Portada</a>
          <a href="productos.html" class="btn btn-sm btn-outline-dark fw-semibold text-uppercase">Ver Catálogo</a>
          <button type="button" class="btn btn-sm btn-danger fw-semibold text-uppercase" onclick="cerrarSesion()">Salir</button>
        </div>
      </div>

      <div class="row align-items-center g-3">
        <div class="col-md-7">
          <h4 class="fw-bold text-uppercase mb-0 text-dark">Repositorio de Diseño e Inventario</h4>
          <small class="text-secondary">Administra logos, banners promocionales, mockups y productos del catálogo.</small>
        </div>
        <div class="col-md-5 text-md-end">
          <button class="btn btn-dark text-warning fw-bold text-uppercase" data-bs-toggle="modal" data-bs-target="#modalRecurso" onclick="prepararCrear()">
            + Nuevo Registro
          </button>
        </div>
      </div>
    </header>

    <!-- CONTROLES DE FILTRO -->
    <section class="row g-3 mb-4">
      <div class="col-md-4">
        <input type="text" id="inputBuscarAdmin" class="form-control border-dark" placeholder="Filtrar por nombre o código SKU...">
      </div>
      <div class="col-md-8 d-flex gap-2 flex-wrap justify-content-md-end" id="filtrosAdmin">
        <button class="btn btn-sm btn-dark active text-uppercase" data-cat="Todos">Todos</button>
        <button class="btn btn-sm btn-outline-dark text-uppercase" data-cat="Productos">Productos</button>
        <button class="btn btn-sm btn-outline-dark text-uppercase" data-cat="Logos y Marca">Logos y Marca</button>
        <button class="btn btn-sm btn-outline-dark text-uppercase" data-cat="Banners y Promos">Banners</button>
        <button class="btn btn-sm btn-outline-dark text-uppercase" data-cat="Mockups Web">Mockups UI</button>
      </div>
    </section>

    <!-- GRILLA CRUD -->
    <main>
      <div class="row g-3" id="contenedorAdminCRUD"></div>
    </main>

  </div>

  <!-- MODAL FORMULARIO CRUD -->
  <div class="modal fade" id="modalRecurso" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content border-dark border-2" id="formRecurso">
        <div class="modal-header bg-dark text-white border-bottom border-warning border-3">
          <h6 class="modal-title text-uppercase fw-bold" id="modalTitulo">Registro de Archivo / Producto</h6>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="recursoId">
          
          <div class="row g-2 mb-3">
            <div class="col-md-8">
              <label class="form-label small fw-bold text-uppercase">Nombre del Elemento</label>
              <input type="text" id="nombre" class="form-control border-secondary" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-bold text-uppercase">Código / SKU</label>
              <input type="text" id="codigo" class="form-control border-secondary" required>
            </div>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-md-6">
              <label class="form-label small fw-bold text-uppercase">Carpeta / Categoría</label>
              <select id="categoria" class="form-select border-secondary" required>
                <option value="Productos">Productos (Catálogo Público)</option>
                <option value="Logos y Marca">Logos y Marca (Header)</option>
                <option value="Banners y Promos">Banners y Promos (Portada)</option>
                <option value="Mockups Web">Mockups Web (Solo Carpeta Interna)</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold text-uppercase">Precio CLP (Productos)</label>
              <input type="number" id="precio" class="form-control border-secondary" min="0" placeholder="0">
            </div>
          </div>

          <div class="mb-3 p-3 bloque-estructural">
            <label class="form-label small fw-bold text-uppercase">Archivo de Imagen (Desde PC):</label>
            <input type="file" id="archivoImagen" class="form-control form-control-sm mb-2" accept="image/*">
            <label class="form-label small text-secondary mb-1">O ruta / URL directa:</label>
            <input type="text" id="imagenUrl" class="form-control form-control-sm" placeholder="assets/logos/logo.png">
          </div>

          <div class="mb-2">
            <label class="form-label small fw-bold text-uppercase">Especificaciones Técnicas / Notas</label>
            <textarea id="descripcion" class="form-control border-secondary" rows="2"></textarea>
          </div>
        </div>
        <div class="modal-footer bg-light">
          <button type="button" class="btn btn-outline-dark text-uppercase btn-sm" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-warning fw-bold text-dark text-uppercase btn-sm">Guardar Registro</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
